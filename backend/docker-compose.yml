version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: blackjack-db
    ports:
      - "27017:27017" 
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped


  backend:
    build: . 
    container_name: blackjack-backend
    expose:
      - "8000" 
    env_file:
      - .env
    depends_on:
      - mongodb
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: blackjack-nginx
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
    restart: always

volumes:
  mongodb_data: